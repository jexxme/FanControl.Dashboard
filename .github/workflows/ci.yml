name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The plugin is built once (net48). Both official Fan Control builds are fetched so the tests and the harness
      # can load that one DLL under .NET Framework 4.8 and under .NET 10, each with the matching Fan Control assemblies.
      - name: Fan Control V285 (.NET Framework 4.8 build)
        id: fc
        uses: ./.github/actions/fancontrol-refs

      - name: Fan Control V285 (.NET 10 build)
        id: fc10
        uses: ./.github/actions/fancontrol-refs
        with:
          asset: FanControl_285_net_10_0.zip
          sha256: 8ddd0819cdaa435be06e37750c5317365375a6f3d75f6c1366fdbb2ea986359d

      - name: Build
        run: dotnet build FanControl.Dashboard.sln -c Release -p:FanControlDir="${{ steps.fc.outputs.dir }}" -p:FanControlNet10Dir="${{ steps.fc10.outputs.dir }}" -nologo

      - name: Test (.NET Framework 4.8 and .NET 10)
        run: dotnet test FanControl.Dashboard.sln -c Release --no-build -p:FanControlDir="${{ steps.fc.outputs.dir }}" -p:FanControlNet10Dir="${{ steps.fc10.outputs.dir }}" -nologo --logger "trx" --results-directory TestResults

      - name: Render UI previews (demo data, both runtimes)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force previews | Out-Null
          $hosts = @(
            @{ exe = 'harness\bin\Release\Harness.exe'; dir = '${{ steps.fc.outputs.dir }}'; tag = '' },
            @{ exe = 'harness\bin\Release\net10.0-windows\Harness.exe'; dir = '${{ steps.fc10.outputs.dir }}'; tag = 'net10-' }
          )
          $runs = @(
            @('dark', '--demo full --theme dark'),
            @('light', '--demo full --theme light'),
            @('settings', '--demo full --theme dark --settings'),
            @('intel-nvidia-760', '--demo intel-nvidia --theme dark --width 760'),
            @('no-gpu-400', '--demo no-gpu --theme light --width 400 --layout 2'),
            @('collapsed', '--demo full --theme dark --collapsed')
          )
          foreach ($h in $hosts) {
            $env:FANCONTROL_DIR = $h.dir
            foreach ($r in $runs) {
              $out = "previews\$($h.tag)$($r[0]).png"
              $p = Start-Process $h.exe -ArgumentList "$($r[1]) --out $out" -Wait -PassThru -NoNewWindow
              if ($p.ExitCode -or -not (Test-Path $out)) { throw "harness failed: $($h.exe) $($r[1])" }
            }
          }
          Get-ChildItem previews | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews-and-test-results
          path: |
            previews/*.png
            TestResults/*.trx
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: FanControl.Dashboard
          path: src/bin/Release/FanControl.Dashboard.dll
