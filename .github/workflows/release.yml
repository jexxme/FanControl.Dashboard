name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in Directory.Build.props" }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($version))\]" -Quiet)) { throw "CHANGELOG.md has no section for $version" }

      - name: Fan Control reference assemblies
        id: fc
        uses: ./.github/actions/fancontrol-refs

      - name: Build and test
        run: |
          dotnet build FanControl.Dashboard.sln -c Release -p:FanControlDir="${{ steps.fc.outputs.dir }}" -nologo
          dotnet test FanControl.Dashboard.sln -c Release --no-build -p:FanControlDir="${{ steps.fc.outputs.dir }}" -nologo

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "FanControl.Dashboard-${{ github.ref_name }}"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force $stage, out | Out-Null
          Copy-Item src\bin\Release\FanControl.Dashboard.dll, dist\Install-Dashboard.ps1, dist\Uninstall-Dashboard.ps1, LICENSE $stage
          Copy-Item README.md (Join-Path $stage 'README.md')
          Compress-Archive -Path "$stage\*" -DestinationPath "out\$name.zip"
          Copy-Item src\bin\Release\FanControl.Dashboard.dll out\
          Get-FileHash out\* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } | Set-Content out\SHA256SUMS.txt
          Get-Content out\SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $body | Set-Content notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --title "${{ github.ref_name }}" --notes-file notes.md --verify-tag
