name: Fan Control reference assemblies
description: >
  Downloads the official Fan Control release from github.com/Rem0o/FanControl.Releases, checks its SHA-256 and
  extracts only the assemblies the build compiles against into the runner's temp folder. Nothing from Fan Control
  is committed, cached in the repository or published: Fan Control is proprietary (see its LICENSE) and is only used
  here the way any user's machine uses an installed copy.
inputs:
  version:
    description: Fan Control release tag
    default: V285
  asset:
    description: Release asset, FanControl_<n>_net_4_8.zip or FanControl_<n>_net_10_0.zip
    default: FanControl_285_net_4_8.zip
  sha256:
    description: Expected SHA-256 of the asset
    default: 988345d09226836e34e9006a263e578484b0585a9e53fced72c9a9425b5af72c
outputs:
  dir:
    description: Folder with the extracted assemblies (pass as FanControlDir)
    value: ${{ steps.get.outputs.dir }}
runs:
  using: composite
  steps:
    - id: get
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $work = Join-Path $env:RUNNER_TEMP 'fancontrol-download'
        $dir = Join-Path $env:RUNNER_TEMP ('fancontrol-' + [IO.Path]::GetFileNameWithoutExtension('${{ inputs.asset }}'))
        New-Item -ItemType Directory -Force $work, $dir | Out-Null
        gh release download '${{ inputs.version }}' --repo Rem0o/FanControl.Releases --pattern '${{ inputs.asset }}' --dir $work --clobber
        $zip = Join-Path $work '${{ inputs.asset }}'
        $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($hash -ne '${{ inputs.sha256 }}') { throw "Unexpected SHA-256 $hash for ${{ inputs.asset }}" }
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        # only the library DLLs at the zip root (Fan Control's own executables and resources are not needed):
        # the plugin API and IPC client, gRPC/protobuf with their dependencies for the IPC tests, MaterialDesign for the harness
        $skip = 'FanControl.dll', 'FanControl.Library.dll', 'FanControl.Resources.dll', 'FanControl.Service.dll'
        $archive = [IO.Compression.ZipFile]::OpenRead($zip)
        try {
          foreach ($e in $archive.Entries) {
            if ($e.FullName -notmatch '^[^/\\]+\.dll$' -or $skip -contains $e.FullName) { continue }
            [IO.Compression.ZipFileExtensions]::ExtractToFile($e, (Join-Path $dir $e.FullName), $true)
          }
        } finally { $archive.Dispose() }
        Remove-Item -Recurse -Force $work
        "$((Get-ChildItem $dir).Count) assemblies in $dir"
        "dir=$dir" >> $env:GITHUB_OUTPUT
